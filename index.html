<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador de estudiantes</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="container py-5">

        <h1 class="text-center mb-4">
            Administrador de estudiantes
        </h1>

        <!-- FORMULARIO -->
        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4 mb-3">
                    Registrar estudiante
                </h2>

                <form id="formEstudiante">

                    <div class="mb-3">

                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input type="text" id="nombre" class="form-control" placeholder="Ingresa el nombre">

                    </div>

                    <div class="mb-3">

                        <label for="edad" class="form-label">
                            Edad
                        </label>

                        <input type="text" id="edad" class="form-control" placeholder="Ingresa la edad">

                    </div>

                    <button type="submit" class="btn btn-primary">

                        Agregar estudiante

                    </button>

                </form>

                <!-- Aquí mostramos errores -->
                <div id="mensaje" class="mt-3"></div>

            </div>

        </div>


        <!-- LISTA DE ESTUDIANTES -->

        <h2 class="h4 mb-3">
            Estudiantes registrados
        </h2>

        <div id="listaEstudiantes" class="row g-3">

        </div>

    </main>


    <!-- Primero cargamos la lógica -->
    <script src="./js/estudiante.js"></script>

    <!-- Después el código que trabaja con el DOM -->
    <script src="./js/main.js"></script>

    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
